; PlatformIO project for the ESP32 scanner node.
;
;   pio run                 # build
;   pio run -t upload       # flash (USB)
;   pio device monitor      # 115200 baud serial log
;
; Any ESP32 board with 4 MB flash works; swap the board line for
; esp32doit-devkit-v1, esp32-s3-devkitc-1 (adjust for S3 pins), etc.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
src_dir = wifi_survey_esp32
build_flags =
    -DCORE_DEBUG_LEVEL=0
